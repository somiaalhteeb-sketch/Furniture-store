<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التقارير</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      background:#f4f6f9;
      font-family: Arial;
    }

    .sidebar{
      position:fixed;
      right:0;
      top:0;
      width:240px;
      height:100vh;
      background:#5a3e2b;
      color:white;
      padding-top:20px;
    }

    .sidebar a{
      display:block;
      color:white;
      padding:12px;
      text-decoration:none;
    }

    .sidebar a:hover{
      background:#3e2a1e;
    }

    .main{
      margin-right:260px;
      padding:20px;
    }

    .card-box{
      border:none;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h4 class="text-center mb-3">⚙️ الأدمن</h4>

  <a href="#">🏠 الرئيسية</a>
  <a href="home.html">🛍️ المنتجات</a>
  <a href="orders.html">🛒 الطلبات</a>
    <a href="catergory.html">🧩 الأقسام</a>
<a href="reports.html">📊 التقارير</a>
  <a href="users.html">👤 المستخدمين</a>
<a href="#" onclick="logout()">🚪 تسجيل خروج</a>
</div>

<!-- Main -->
<div class="main">

  <h2 class="mb-4">📊 التقارير والإحصائيات</h2>

  <!-- Stats -->
  <div class="row g-3 mb-4">

    <div class="col-md-3">
      <div class="card card-box p-3 text-center">
        <h6>إجمالي المبيعات</h6>
        <h3 id="totalSales">$0</h3>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card card-box p-3 text-center">
        <h6>عدد الطلبات</h6>
        <h3 id="totalOrders">0</h3>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card card-box p-3 text-center">
        <h6>عدد المنتجات</h6>
        <h3 id="totalProducts">0</h3>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card card-box p-3 text-center">
        <h6>عدد المستخدمين</h6>
        <h3 id="totalUsers">0</h3>
      </div>
    </div>

  </div>

  <!-- Chart -->
  <div class="card card-box p-3 mb-4">
    <h5 class="mb-3">📈 المبيعات خلال الأسبوع</h5>
    <canvas id="salesChart"></canvas>
  </div>

  <!-- Top Products -->
  <div class="card card-box p-3">
    <h5>🔥 المنتجات الأكثر مبيعاً</h5>

    <table class="table text-center mt-3">
      <thead class="table-dark">
        <tr>
          <th>المنتج</th>
          <th>عدد الطلبات</th>
          <th>الإيرادات</th>
        </tr>
      </thead>

      <tbody id="topProducts"></tbody>

    </table>
  </div>

</div>

<script>

/* بيانات */
let products = JSON.parse(localStorage.getItem("products")) || [];
let orders = JSON.parse(localStorage.getItem("cart")) || [];
let users = JSON.parse(localStorage.getItem("users")) || [];

/* حسابات */
document.getElementById("totalProducts").innerText = products.length;
document.getElementById("totalOrders").innerText = orders.length;
document.getElementById("totalUsers").innerText = users.length;

/* حساب المبيعات */
let total = 0;
orders.forEach(o => {
  let price = parseInt(o.price);
  total += price;
});

document.getElementById("totalSales").innerText = "$" + total;

/* Chart */
new Chart(document.getElementById("salesChart"), {
  type: 'bar',
  data: {
    labels: ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],
    datasets: [{
      label: 'المبيعات',
      data: [120, 200, 150, 300, 250, 180, 220],
      backgroundColor: '#5a3e2b'
    }]
  }
});

/* Top products */
let stats = {};

orders.forEach(o=>{
  if(!stats[o.name]){
    stats[o.name] = {count:0, total:0};
  }
  stats[o.name].count++;
  stats[o.name].total += parseInt(o.price);
});

let table = document.getElementById("topProducts");

for(let key in stats){
  table.innerHTML += `
    <tr>
      <td>${key}</td>
      <td>${stats[key].count}</td>
      <td>$${stats[key].total}</td>
    </tr>
  `;
}

  
    function logout(){

  // حذف بيانات المستخدم (الأدمن)
  localStorage.removeItem("user");

  // (اختياري) حذف كل البيانات
  // localStorage.clear();

  alert("تم تسجيل الخروج بنجاح 👋");

  // تحويل لصفحة تسجيل الدخول
  window.location.href = "login.html";
}
</script>

</body>
</html>
