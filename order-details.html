<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الطلب</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
  padding:20px;
}

.box{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.item{
  display:flex;
  gap:10px;
  margin:10px 0;
  border-bottom:1px solid #eee;
  padding-bottom:10px;
}

.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}

.back{
  background:#333;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:10px;
}
</style>

</head>

<body>

<div class="box">

<button class="back" onclick="history.back()">رجوع</button>

<div id="content"></div>

</div>

<script>

let order = JSON.parse(localStorage.getItem("selectedOrder"));

let container = document.getElementById("content");

if(!order){
  container.innerHTML = "<h3>لا يوجد طلب</h3>";
}else{

  let itemsHTML = order.items.map(item=>`
    <div class="item">
      <img src="${item.img}">
      <div>
        <h4>${item.name}</h4>
        <p>${item.price}</p>
      </div>
    </div>
  `).join("");

  container.innerHTML = `
    <h2>📦 ${order.id}</h2>
    <p>📅 ${order.date}</p>
    <p>💰 ${order.total} ريال</p>
    <hr>
    ${itemsHTML}
  `;
}

</script>

</body>
</html>
