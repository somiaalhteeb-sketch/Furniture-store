<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة المشتريات - متجرك</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f7f3ee; /* خلفية متناسقة مع ألوان الخشب */
  padding:20px;
}

.container{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
  position: relative;
}

/* زر الرجوع الخشبي */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #916243; 
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 20px;
  transition: 0.3s ease;
}

.back-btn:hover {
  background: #5a3e2b;
  transform: translateX(-3px);
}

.header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 2px solid #f7f3ee;
    padding-bottom: 10px;
}

h2 { color: #333; margin: 0; }

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #f0f0f0;
  padding:15px 0;
}

.item img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:12px;
  border: 1px solid #eee;
}

.details{
  flex:1;
  margin-right:20px;
}

.details h4 { margin: 0; font-size: 17px; color: #444; }
.details p { margin: 5px 0 0 0; color: #888; font-size: 14px; }

.total-box{
  text-align: left;
  font-size: 22px;
  margin-top: 20px;
  font-weight: bold;
  color: #916243; /* لون بني خشبي للإجمالي */
  padding: 10px;
  background: #fdfaf7;
  border-radius: 8px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:10px;
  font-family: inherit;
  transition: 0.3s;
}

.remove{
  background:#fceaea;
  color:#e74c3c;
  padding: 8px 15px;
}

.remove:hover {
  background:#e74c3c;
  color:#fff;
}

/* زر إتمام الدفع باللون البني الخشبي */
.checkout{
  background: #916243; 
  color: #fff;
  width: 100%;
  margin-top: 20px;
  font-size: 19px;
  padding: 16px;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(145, 98, 67, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.checkout:hover {
  background: #5a3e2b;
  box-shadow: 0 6px 20px rgba(145, 98, 67, 0.3);
}

.empty-cart {
    text-align: center;
    padding: 50px;
    color: #bbb;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
    
    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-chevron-right"></i> رجوع
    </a>

    <div class="header-flex">
        <h2>🛒 سلة المشتريات</h2>
    </div>

    <div id="cart"></div>

    <div class="total-box">
        الإجمالي: <span id="total">0</span> $
    </div>

    <button class="checkout" onclick="goCheckout()">
        <i class="fas fa-credit-card"></i> إتمام الدفع
    </button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let container = document.getElementById("cart");

function render(){
  container.innerHTML = "";
  let total = 0;

  if(cart.length === 0) {
      container.innerHTML = `
        <div class='empty-cart'>
            <i class="fas fa-shopping-basket" style="font-size: 50px; display: block; margin-bottom: 10px;"></i>
            السلة فارغة حالياً
        </div>`;
      document.getElementById("total").innerText = "0.00";
      return;
  }

  cart.forEach((item, index) => {
    // تنظيف السعر من أي رموز غير رقمية وتحويله
    let priceNum = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
    let qtyNum = item.qty || 1;
    let itemTotal = priceNum * qtyNum;
    total += itemTotal;

    container.innerHTML += `
      <div class="item">
        <img src="${item.img}">
        <div class="details">
          <h4>${item.name}</h4>
          <p>${qtyNum} × ${item.price} = ${itemTotal.toFixed(2)} $</p>
        </div>
        <button class="remove" onclick="removeItem(${index})">
            <i class="fas fa-trash-alt"></i> حذف
        </button>
      </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  render();
}

function goCheckout(){
  if(cart.length === 0) {
      alert("السلة فارغة، أضف بعض المنتجات أولاً!");
      return;
  }
  window.location.href = "checkout.html";
}

render();
</script>

</body>
</html>
