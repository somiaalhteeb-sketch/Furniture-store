<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - متجر الأثاث</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f3ee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* تنسيق الشعار (Logo) */
        .logo-container {
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 45px;
            color: #916243;
            background: #fdfaf7;
            padding: 15px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        h2 { color: #333; font-size: 22px; margin-bottom: 10px; }

        .desc {
            font-size: 14px;
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            text-align: right;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #916243;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #916243;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 15px;
        }

        button:hover { background: #5a3e2b; }

        .error {
            color: #e74c3c;
            font-size: 13px;
            text-align: right;
            display: none;
            margin-top: -5px;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #916243;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <div class="logo-icon">
            <i class="fas fa-unlock-alt"></i> </div>
        <div class="logo-text">متجر الأثاث الراقي</div>
    </div>

    <h2>نسيت كلمة المرور</h2>

    <p class="desc">
        أدخل بريدك الإلكتروني أدناه لإرسال رمز التحقق الخاص بحسابك.
    </p>

    <select id="userRole">
        <option value="user">أنا مستخدم (تصفح وشراء)</option>
        <option value="admin">أنا مسؤول (إدارة النظام)</option>
    </select>

    <input id="email" type="email" placeholder="example@gmail.com">

    <div class="error" id="error">البريد الإلكتروني غير صحيح</div>

    <button onclick="sendEmail()">إرسال رمز التحقق</button>

    <a href="index.html" class="back-link">العودة لتسجيل الدخول</a>

</div>

<script>
function sendEmail() {
    const email = document.getElementById("email").value;
    const role = document.getElementById("userRole").value;
    const error = document.getElementById("error");

    // التحقق البسيط من البريد الإلكتروني
    if (email === "" || !email.includes("@")) {
        error.innerText = "الرجاء إدخال بريد إلكتروني صحيح";
        error.style.display = "block";
        return;
    }

    error.style.display = "none";

    // تخزين البيانات مؤقتاً لاستخدامها في verify.html
    localStorage.setItem("tempRole", role);
    localStorage.setItem("authMode", "reset"); // تحديد الوضع كاستعادة كلمة مرور

    // التوجيه لصفحة التحقق
    window.location.href = "verify.html";
}
</script>

</body>
</html>
