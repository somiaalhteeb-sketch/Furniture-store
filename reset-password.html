<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور الموحدة</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* تنسيق الصفحة لتكون في منتصف الشاشة وبمظهر عصري */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f3ee; /* الخلفية الخشبية الموحدة لمتجرك */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* تنسيق الشعار (Logo) في الأعلى */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 50px;
            color: #916243; /* اللون البني الخشبي المعتمد */
            background: #fdfaf7;
            padding: 15px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .logo-text { font-size: 18px; font-weight: bold; color: #333; }

        h2 { color: #555; margin-bottom: 20px; font-size: 22px; }

        /* تنسيق حقول الإدخال وقائمة الاختيار */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            text-align: right; /* RTL */
            font-family: inherit;
        }

        /* تنسيق زر التأكيد الخشبي */
        button {
            width: 100%;
            padding: 12px;
            background: #916243;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s ease;
            font-family: inherit;
            margin-top: 15px;
        }
        button:hover { background: #5a3e2b; transform: translateY(-1px); }

        /* تنسيق رسالة الخطأ */
        .error {
            color: #e74c3c;
            font-size: 13px;
            text-align: right;
            display: none; /* مخفية */
            margin-top: 5px;
            padding-right: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <div class="logo-icon">
            <i class="fas fa-key"></i> </div>
        <div class="logo-text">متجر الأثاث الراقي</div>
    </div>

    <h2>إعادة تعيين كلمة المرور</h2>
    
    <select id="userRole">
        <option value="user">تغيير كلمة المرور (كمستخدم)</option>
        <option value="admin">تغيير كلمة المرور (كمسؤول/أدمن)</option>
    </select>

    <input id="pass1" type="password" placeholder="كلمة المرور الجديدة">
    <input id="pass2" type="password" placeholder="تأكيد كلمة المرور">

    <div class="error" id="error">كلمتا المرور غير متطابقتين</div>

    <button onclick="resetPass()">تأكيد وتغيير</button>
</div>

<script>
function resetPass() {
    const p1 = document.getElementById("pass1").value;
    const p2 = document.getElementById("pass2").value;
    const role = document.getElementById("userRole").value; // الحصول على الدور المختلط
    const errorEl = document.getElementById("error");

    // التحقق من تعبئة الحقول
    if (p1 === "" || p2 === "") {
        errorEl.innerText = "الرجاء ملء جميع الحقول المطلوبة";
        errorEl.style.display = "block";
        return;
    }

    // التحقق من تطابق كلمتي المرور
    if (p1 !== p2) {
        errorEl.innerText = "كلمتا المرور غير متطابقتين، الرجاء المحاولة مرة أخرى";
        errorEl.style.display = "block";
    } else {
        errorEl.style.display = "none";
        
        // محاكاة حفظ الدور في localStorage
        localStorage.setItem("tempRole", role);
        localStorage.setItem("tempMode", "resetPass");
        
        // التوجيه لصفحة النجاح (يجب أن تنشئ هذا الملف "success.html")
        window.location.href = "success.html";
    }
}
</script>

</body>
</html>
