<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب موحد - متجر الأثاث</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f3ee; /* الخلفية الخشبية الموحدة */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* تنسيق الشعار (Logo) */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 50px; /* حجم أيقونة الشعار */
            color: #916243; /* اللون البني الخشبي */
            background-color: #f7f3ee; /* خلفية أفتح للدائرة */
            padding: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        h2 { color: #555; margin-bottom: 25px; font-size: 24px; }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            text-align: right;
            font-size: 16px;
        }

        input:focus, select:focus {
            border-color: #916243;
            box-shadow: 0 0 5px rgba(145, 98, 67, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #916243; /* اللون البني المعتمد */
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { background: #5a3e2b; transform: translateY(-2px); }

        .switch {
            margin-top: 20px;
            color: #916243;
            cursor: pointer;
            font-size: 15px;
            text-decoration: underline;
            display: block;
        }

        /* نافذة النجاح المنبثقة (Pop-up) */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none; /* مخفي افتراضياً */
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .success-popup {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 3px solid #2ed573;
            transform: scale(0.5);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* تفعيل الظهور */
        .success-overlay.active { display: flex; }
        .success-overlay.active .success-popup { transform: scale(1); }

        /* الأيقونة الضخمة */
        .success-popup i {
            font-size: 150px;
            color: #2ed573;
            display: block;
            margin-bottom: 20px;
        }

        .success-popup span {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div id="successOverlay" class="success-overlay">
    <div class="success-popup">
        <i class="fas fa-check-circle"></i> <span>تم إنشاء الحساب بنجاح!</span>
    </div>
</div>

<div class="container">
    <div class="logo-container">
        <div class="logo-icon">
            <i class="fas fa-chair"></i> </div>
        <div class="logo-text">متجر الأثاث الراقي</div>
    </div>

    <h2>إنشاء حساب جديد</h2>
    
    <input type="text" id="userName" placeholder="الاسم الكامل">
    <input type="email" id="userEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="userPass" placeholder="كلمة المرور">
    
    <select id="userRole">
        <option value="user">تسجيل كمستخدم (شراء)</option>
        <option value="admin">تسجيل كمسؤول (أدمن)</option>
    </select>

    <button onclick="handleRegister()">تسجيل</button>
    
    <a href="login.html" class="switch">لديك حساب؟ سجل دخولك</a>
</div>

<script>
function handleRegister() {
    const name = document.getElementById("userName").value;
    const email = document.getElementById("userEmail").value;
    const pass = document.getElementById("userPass").value;
    const role = document.getElementById("userRole").value;

    if (name.trim() === "" || email.trim() === "" || pass.trim() === "") {
        alert("الرجاء إدخال كافة البيانات");
        return;
    }

    // إظهار نافذة النجاح الضخمة
    const overlay = document.getElementById("successOverlay");
    overlay.classList.add("active");

    // تخزين البيانات في LocalStorage
    localStorage.setItem("tempName", name);
    localStorage.setItem("tempRole", role); //admin or user
    localStorage.setItem("authMode", "register");

    // التوجيه بعد ثانيتين
    setTimeout(() => {
        window.location.href = "verify.html";
    }, 2500);
}
</script>

</body>
</html>
